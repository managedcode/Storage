name: build-and-test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ManagedCode.Storage.slnx

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Verify formatting
      run: dotnet format ManagedCode.Storage.slnx --verify-no-changes --no-restore

    - name: Build
      run: dotnet build ManagedCode.Storage.slnx --configuration Release --no-restore

    - name: Install Playwright browser
      run: dotnet playwright -p Tests/ManagedCode.Storage.Tests/ManagedCode.Storage.Tests.csproj install chromium

    - name: Test
      run: dotnet test Tests/ManagedCode.Storage.Tests/ManagedCode.Storage.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category!=BrowserStress" /p:CollectCoverage=true --logger "trx;LogFileName=storage-tests.trx"

    - name: Preserve coverage and test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: storage-quality-results
        path: |
          artifacts/coverage/coverage.*
          Tests/ManagedCode.Storage.Tests/*.trx
        if-no-files-found: error

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: artifacts/coverage/coverage.cobertura.xml
        disable_search: true
        fail_ci_if_error: true

  browser-stress:
    name: browser-stress
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ManagedCode.Storage.slnx

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Build
      run: dotnet build ManagedCode.Storage.slnx --configuration Release --no-restore

    - name: Install Playwright browser
      run: dotnet playwright -p Tests/ManagedCode.Storage.Tests/ManagedCode.Storage.Tests.csproj install chromium

    - name: Browser stress test
      run: dotnet test Tests/ManagedCode.Storage.Tests/ManagedCode.Storage.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=BrowserStress"
